[package]
name = "bola"
version = "0.2.0"
edition = "2024"
description = "A lightweight native rust linear algebra library."
authors = ["Aleksander Lovric <alexlovric@gmail.com>"]
license = "MIT"
repository = "https://github.com/alexlovric/bola"
documentation = "https://docs.rs/bola"
readme = "README.md"
keywords = ["math", "linear-algebra", "lapack", "matrix"]
categories = ["science", "mathematics", "simulation"]

[lib]
name = "bola"
path = "src/lib.rs"

[dependencies]
rayon = "1.12.0"

[dev-dependencies]
criterion = "0.8.2"
matrixmultiply = { version = "0.3.11", features = ["threading"] }
rand = "0.10.3"
cblas = "0.5.0"
lapack = "0.20.0"

[features]
profiling = []
external-blas = []

[[bench]]
name = "getrf"
harness = false

[[bench]]
name = "gemm"
harness = false
required-features = ["external-blas"]
